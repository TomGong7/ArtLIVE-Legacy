<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ArtLIVE · 画智体 · 欢迎</title>
    
    <link rel="stylesheet" href="../Main/ArtStudio.css" />
    <link rel="stylesheet" href="Welcome.css" />
  </head>
  <body>
    <nav class="topbar glass-panel" id="topbar"></nav>

    <!-- ===== 全屏国画轮播 ===== -->
    <section class="hero-fullscreen" id="hero-fullscreen">
      <div class="painting-carousel" id="painting-carousel">
        <div class="painting-slide painting-bg1 active" data-index="0"></div>
        <div class="painting-slide painting-bg2" data-index="1"></div>
        <div class="painting-slide painting-bg3" data-index="2"></div>
        <div class="painting-slide painting-bg4" data-index="3"></div>
      </div>

      <div class="hero-brand">
          <div class="brandmark"></div>
          <h1 class="hero-title">ArtLIVE   画智体</h1>
          <p class="hero-subtitle">墨韵流转 · 数字山水</p>
          <p class="hero-desc">传统艺术的韵味，在数字空间里静静展开</p>
        </div>

      <div class="carousel-dots" id="carousel-dots">
        <button class="carousel-dot active" data-index="0" aria-label="画作一"></button>
        <button class="carousel-dot" data-index="1" aria-label="画作二"></button>
        <button class="carousel-dot" data-index="2" aria-label="画作三"></button>
        <button class="carousel-dot" data-index="3" aria-label="画作四"></button>
      </div>

      <div class="scroll-hint">
        <svg class="scroll-arrow" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      </div>
    </section>

    <!-- ===== 内容区 ===== -->
    <main class="page-shell welcome-content" data-active="welcome">
      <section class="feature-grid" aria-label="项目板块入口">
        <a class="feature-card glass-panel" href="../Gallary/Gallary.html">
          <span class="feature-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
              <circle cx="8.5" cy="8.5" r="1.5"/>
              <polyline points="21 15 16 10 5 21"/>
            </svg>
          </span>
          <h2>画廊</h2>
          <p>浏览历代国画，山水、人物、花鸟，随心翻阅。</p>
        </a>

        <a class="feature-card glass-panel" href="../KnowledgeBase/KnowledgeBase.html">
          <span class="feature-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
              <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
              <line x1="8" y1="7" x2="16" y2="7"/>
              <line x1="8" y1="11" x2="14" y2="11"/>
            </svg>
          </span>
          <h2>知识库</h2>
          <p>国画技法、诗词赏析、艺术史话，静心阅读。</p>
        </a>

        <a class="feature-card glass-panel" href="../Workshop/Workshop.html">
          <span class="feature-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/>
              <path d="M2 12h20"/>
            </svg>
          </span>
          <h2>工坊</h2>
          <p>以文字或图片为引，生成专属的国画作品。</p>
        </a>

        <a class="feature-card glass-panel" href="../Community/Community.html">
          <span class="feature-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
              <circle cx="9" cy="7" r="4"/>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
            </svg>
          </span>
          <h2>社区</h2>
          <p>与同好交流创作心得，分享你的见解。</p>
        </a>

        <a class="feature-card glass-panel" href="../About/About.html">
          <span class="feature-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <line x1="12" y1="16" x2="12" y2="12"/>
              <line x1="12" y1="8" x2="12.01" y2="8"/>
            </svg>
          </span>
          <h2>关于</h2>
          <p>了解项目的缘起与设计背后的思考。</p>
        </a>

        <a class="feature-card glass-panel" href="../Me/Me.html">
          <span class="feature-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="8" r="4"/>
              <path d="M4 20c0-4 4-7 8-7s8 3 8 7"/>
            </svg>
          </span>
          <h2>我</h2>
          <p>你的收藏、作品与帖子，都在这里。</p>
        </a>
      </section>
    </main>

    <script src="../Main/ArtStudio.js"></script>
    <script src="Welcome.js"></script>
  </body>
</html>
