<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ArtLIVE · 画智体 · 登录</title>
    
    <link rel="stylesheet" href="../Main/ArtStudio.css" />
    <link rel="stylesheet" href="Login.css" />
  </head>
  <body>
    <div class="background-orb orb-one"></div>
    <div class="background-orb orb-two"></div>
    <div class="background-orb orb-three"></div>

    <main class="page-shell login-shell">
      <a class="login-back" href="../Welcome/Welcome.html">
        <span class="back-arrow">←</span>
        <span>返回首页</span>
      </a>

      <div class="login-card glass-panel">
        <div class="login-header">
          <span class="topbar-brand-mark"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="17" cy="5" r="2"/><path d="M3 20 L8 12 L12 16 L17 7 L22 13"/></svg></span>
          <h1 class="title-lg" id="login-title">欢迎回来</h1>
          <p class="subtitle" id="login-subtitle">登录你的账号</p>
        </div>

        <div class="login-tabs">
          <button class="login-tab active" data-tab="login">登录</button>
          <button class="login-tab" data-tab="register">注册</button>
        </div>

        <!-- ===== 登录表单（两步） ===== -->
        <div class="login-form" id="login-form">
          <div class="step-indicator" id="login-step-indicator">
            <div class="step-dot active" data-step="1">
              <span class="step-num">1</span>
              <span class="step-label">输入账号</span>
            </div>
            <div class="step-line" data-line="1"></div>
            <div class="step-dot" data-step="2">
              <span class="step-num">2</span>
              <span class="step-label">验证登录</span>
            </div>
          </div>

          <div class="step-panels" id="login-step-panels">
            <div class="form-error hidden" id="login-error"></div>
            <div class="step-panel active" data-step="1">
              <div class="step-icon">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              </div>
              <p class="step-desc">请输入你的账号</p>
              <div class="form-group">
                <label class="form-label" for="login-email">账号</label>
                <input
                  class="input"
                  type="text"
                  id="login-email"
                  placeholder="请输入账号"
                  autocomplete="username"
                />
              </div>
              <div class="step-actions">
                <button type="button" class="btn btn-primary btn-lg btn-full step-next" data-next="2">下一步</button>
              </div>
            </div>

            <div class="step-panel" data-step="2">
              <div class="step-icon">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              </div>
              <p class="step-desc">请输入密码完成登录</p>
              <div class="form-group">
                <label class="form-label" for="login-password">密码</label>
                <div class="password-wrap">
                  <input
                    class="input"
                    type="password"
                    id="login-password"
                    placeholder="请输入密码"
                    autocomplete="current-password"
                  />
                  <button type="button" class="password-toggle" aria-label="切换密码可见">
                    <span class="toggle-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></span>
                  </button>
                </div>
              </div>
              <div class="form-options">
                <label class="checkbox-label">
                  <input type="checkbox" />
                  <span>记住我</span>
                </label>
                <a class="form-link" href="#">忘记密码？</a>
              </div>
              <div class="step-actions">
                <button type="button" class="btn btn-lg btn-full step-prev" data-prev="1">上一步</button>
                <button type="submit" class="btn btn-primary btn-lg btn-full" id="login-submit">登录</button>
              </div>
            </div>
          </div>
        </div>

        <!-- ===== 注册表单（多步骤） ===== -->
        <div class="login-form hidden" id="register-form">
          <!-- 步骤进度指示器 -->
          <div class="step-indicator" id="register-step-indicator">
            <div class="step-dot active" data-step="1">
              <span class="step-num">1</span>
              <span class="step-label">创建账号</span>
            </div>
            <div class="step-line" data-line="1"></div>
            <div class="step-dot" data-step="2">
              <span class="step-num">2</span>
              <span class="step-label">设置密码</span>
            </div>
            <div class="step-line" data-line="2"></div>
            <div class="step-dot" data-step="3">
              <span class="step-num">3</span>
              <span class="step-label">确认信息</span>
            </div>
          </div>

          <!-- 步骤面板容器 -->
          <div class="step-panels" id="register-step-panels">
            <div class="form-error hidden" id="register-error"></div>
            <!-- 步骤 1：创建账号 -->
            <div class="step-panel active" data-step="1">
              <div class="step-icon">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              </div>
              <p class="step-desc">为你的艺术空间起一个名字</p>
              <div class="form-group">
                <label class="form-label" for="register-name">用户名</label>
                <input
                  class="input"
                  type="text"
                  id="register-name"
                  placeholder="请输入用户名"
                  autocomplete="username"
                />
              </div>
              <div class="step-actions">
                <button type="button" class="btn btn-primary btn-lg btn-full step-next" data-next="2">下一步</button>
              </div>
            </div>

            <!-- 步骤 2：设置密码 -->
            <div class="step-panel" data-step="2">
              <div class="step-icon">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              </div>
              <p class="step-desc">设置一个安全的密码</p>
              <div class="form-group">
                <label class="form-label" for="register-password">密码</label>
                <div class="password-wrap">
                  <input
                    class="input"
                    type="password"
                    id="register-password"
                    placeholder="请设置密码（至少6位）"
                    autocomplete="new-password"
                  />
                  <button type="button" class="password-toggle" aria-label="切换密码可见">
                    <span class="toggle-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></span>
                  </button>
                </div>
              </div>
              <div class="form-group">
                <label class="form-label" for="register-confirm">确认密码</label>
                <input
                  class="input"
                  type="password"
                  id="register-confirm"
                  placeholder="请再次输入密码"
                  autocomplete="new-password"
                />
              </div>
              <div class="step-actions">
                <button type="button" class="btn btn-lg btn-full step-prev" data-prev="1">上一步</button>
                <button type="button" class="btn btn-primary btn-lg btn-full step-next" data-next="3">下一步</button>
              </div>
            </div>

            <!-- 步骤 3：确认信息 -->
            <div class="step-panel" data-step="3">
              <div class="step-icon">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
              </div>
              <p class="step-desc">确认你的注册信息</p>
              <div class="review-card">
                <div class="review-row">
                  <span class="review-label">用户名</span>
                  <span class="review-value" id="review-name">—</span>
                </div>
                <div class="review-row">
                  <span class="review-label">密码</span>
                  <span class="review-value" id="review-password">—</span>
                </div>
              </div>
              <div class="step-actions">
                <button type="button" class="btn btn-lg btn-full step-prev" data-prev="2">上一步</button>
                <button type="submit" class="btn btn-primary btn-lg btn-full" id="register-submit">完成注册</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="Login.js"></script>
  </body>
</html>
