<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ArtLIVE · 画智体 · 智能评析</title>
    
    <link rel="stylesheet" href="../Main/ArtStudio.css" />
    <link rel="stylesheet" href="Detail.css" />
  </head>
  <body>
    <div class="background-orb orb-one"></div>
    <div class="background-orb orb-two"></div>

    <main class="page-shell" data-active="gallery">
      <nav class="topbar glass-panel" id="topbar"></nav>

      <div class="guide-layout">
        <section class="guide-display">
          <div class="guide-image-wrap glass-panel" id="guide-image-wrap">
            <div class="guide-placeholder" id="guide-placeholder"></div>
          </div>
          <div class="guide-actions">
            <button class="guide-action-btn" id="guide-back" title="返回画廊">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/></svg>
              <span>返回画廊</span>
            </button>
            <button class="guide-action-btn" id="guide-collect" title="收藏">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
              <span>收藏</span>
            </button>
            <button class="guide-action-btn" id="guide-share" title="分享">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
              <span>分享</span>
            </button>
          </div>
        </section>

        <section class="guide-info glass-panel">
          <div class="guide-info-header">
            <h1 class="title-xl" id="guide-title"></h1>
            <p class="guide-author" id="guide-author"></p>
            <span class="guide-badge" id="guide-badge"></span>
          </div>

          <div class="guide-section">
            <h3 class="title-sm">作品简介</h3>
            <p class="guide-desc" id="guide-desc"></p>
          </div>

          <div class="guide-section">
            <h3 class="title-sm">智能评析</h3>
            <div class="guide-ai-content" id="guide-ai-content">
              <div class="guide-ai-placeholder">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/><path d="M5 3v4"/><path d="M19 17v4"/><path d="M3 5h4"/><path d="M17 19h4"/></svg>
                <p>点击按钮开始智能评析</p>
                <button class="guide-start-btn" id="guide-start-btn">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/><path d="M5 3v4"/><path d="M19 17v4"/><path d="M3 5h4"/><path d="M17 19h4"/></svg>
                  <span>开始评析</span>
                </button>
              </div>
            </div>
            <button class="guide-voice-btn hidden" id="guide-voice" title="语音播放">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
              <span>语音播放</span>
            </button>
          </div>
        </section>
      </div>
    </main>

    <script src="../Main/ArtStudio.js"></script>
    <script src="Detail.js"></script>
  </body>
</html>
