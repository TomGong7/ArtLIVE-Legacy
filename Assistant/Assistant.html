<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ArtLIVE · 画智体 · 助手</title>
    
    <link rel="stylesheet" href="../Main/ArtStudio.css" />
    <link rel="stylesheet" href="Assistant.css" />
  </head>
  <body>
    <div class="background-orb orb-one"></div>
    <div class="background-orb orb-two"></div>

    <main class="page-shell assistant-shell" data-active="assistant">
      <nav class="topbar glass-panel" id="topbar"></nav>

      <div class="assistant-layout">
        <aside class="assistant-sidebar glass-panel">
          <div class="sidebar-actions">
            <button class="btn btn-sm btn-secondary btn-full" id="new-chat">新建会话</button>
          </div>
          <h3 class="title-sm">会话历史</h3>
          <div class="chat-history" id="chat-history">
            <button class="history-item active" data-id="new">
              <span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 3a2.83 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg></span>
              <span>新会话</span>
            </button>
          </div>
          <div class="sidebar-actions-bottom">
            <button class="btn btn-sm btn-danger btn-full" id="clear-chats">清空记录</button>
          </div>
        </aside>

        <section class="assistant-main glass-panel">
          <div class="chat-messages" id="chat-messages">
            <div class="chat-messages-inner" id="chat-messages-inner">
            <div class="chat-welcome">
              <span class="chat-welcome-icon"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M12 2a10 10 0 0 1 0 20"/></svg></span>
              <h3>国风艺术助手</h3>
              <p>关于国画、书法、诗词、艺术史，您都可以问我。</p>
              <div class="quick-prompts">
                <button class="quick-prompt" data-prompt="介绍一下水墨画的基本技法">水墨画技法</button>
                <button class="quick-prompt" data-prompt="推荐几幅适合初学者临摹的国画">临摹推荐</button>
                <button class="quick-prompt" data-prompt="文房四宝怎么选？">文房四宝</button>
                <button class="quick-prompt" data-prompt="中国画和西方油画的主要区别是什么？">中西对比</button>
              </div>
            </div>
            </div>
          </div>
          <div class="chat-input-area">
            <p class="chat-disclaimer">提示：回复内容由AI生成，可能存在不准确之处，仅供参考。</p>
            <div class="chat-input-wrap">
              <input
                type="text"
                class="input chat-input"
                id="chat-input"
                placeholder="输入您的问题…"
                autocomplete="off"
              />
              <button class="send-btn" id="send-btn" title="发送">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
              </button>
            </div>
          </div>
        </section>
      </div>
    </main>

    <script src="../Main/ArtStudio.js"></script>
    <script src="Assistant.js"></script>
  </body>
</html>
